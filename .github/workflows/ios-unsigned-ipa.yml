name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-unsigned-ipa.yml'

permissions:
  contents: read

jobs:
  unsigned-device-ipa:
    runs-on: macos-14
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build device app without Apple signing
        run: >-
          xcodebuild
          -project ios/YNNuJwHelper.xcodeproj
          -scheme YNNuJwHelper
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
          build
      - name: Package unsigned IPA
        run: |
          APP_PATH='build/DerivedData/Build/Products/Release-iphoneos/YNNuJwHelper.app'
          test -d "$APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          (
            cd build/ipa
            /usr/bin/zip -qry ../HandHelper-unsigned.ipa Payload
          )
          unzip -l build/HandHelper-unsigned.ipa | grep -q 'Payload/YNNuJwHelper.app/Info.plist'
          ACTUAL_WEB_URL="$(/usr/libexec/PlistBuddy -c 'Print :HandHelperWebURL' "$APP_PATH/Info.plist")"
          test "$ACTUAL_WEB_URL" = 'https://hand.zhangzh.cc'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Hand-Helper-unsigned-ipa-web-url-fixed
          path: build/HandHelper-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
