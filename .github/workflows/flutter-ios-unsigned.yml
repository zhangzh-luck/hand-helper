name: Flutter iOS Release (unsigned)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: flutter_client
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # device_info_plus 13.3.0 references NSProcessInfo.isiOSAppOnVision,
      # which is declared in the iOS 26.1 SDK but not Xcode 16.4's SDK.
      - name: Select Xcode 26.1.1
        run: |
          test -d /Applications/Xcode_26.1.1.app/Contents/Developer
          sudo xcode-select -s /Applications/Xcode_26.1.1.app/Contents/Developer

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
          flutter-version: '3.47.3'
          cache: true

      - name: Show build tools
        run: |
          flutter --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          pod --version

      - name: Resolve Flutter dependencies
        run: |
          flutter precache --ios
          flutter pub get

      - name: Install iOS dependencies
        run: pod install --repo-update
        working-directory: flutter_client/ios

      - name: Build unsigned iOS Release app
        run: flutter build ios --release --no-codesign

      - name: Package build artifact
        run: |
          test -d build/ios/iphoneos/Runner.app
          tar -czf build/Runner-ios-release-unsigned.tar.gz -C build/ios/iphoneos Runner.app

      - name: Upload unsigned app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flutter-ios-release-unsigned-app
          path: flutter_client/build/Runner-ios-release-unsigned.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Package and verify unsigned IPA
        run: |
          app=build/ios/iphoneos/Runner.app
          payload=build/unsigned-ipa/Payload
          ipa=build/HandHelper-unsigned.ipa
          extracted=build/unsigned-ipa/verified/Payload/Runner.app

          test -d "$app"
          test -f "$app/Info.plist"
          test -x "$app/Runner"
          mkdir -p "$payload"
          /usr/bin/ditto "$app" "$payload/Runner.app"
          (cd build/unsigned-ipa && /usr/bin/ditto -c -k --keepParent Payload ../HandHelper-unsigned.ipa)

          /usr/bin/unzip -tqq "$ipa"
          /usr/bin/ditto -x -k "$ipa" build/unsigned-ipa/verified
          test -f "$extracted/Info.plist"
          test -x "$extracted/Runner"
          while IFS= read -r -d '' file; do
            test -f "$extracted/$file"
            test "$(stat -f '%Lp' "$app/$file")" = "$(stat -f '%Lp' "$extracted/$file")"
          done < <(cd "$app" && find . -type f -print0)
          while IFS= read -r link; do
            test -L "$extracted/$link"
            test "$(readlink "$app/$link")" = "$(readlink "$extracted/$link")"
          done < <(cd "$app" && find . -type l -print)

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: HandHelper-unsigned-ipa
          path: flutter_client/build/HandHelper-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
