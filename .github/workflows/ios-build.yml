name: Build iOS (unsigned verification)

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

jobs:
  simulator-build:
    runs-on: macos-14
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app || xcodebuild -version
      - name: Build for iOS Simulator (no signing)
        run: >-
          xcodebuild
          -project ios/YNNuJwHelper.xcodeproj
          -scheme YNNuJwHelper
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: YNNuJwHelper-simulator-app
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/YNNuJwHelper.app
          if-no-files-found: error
