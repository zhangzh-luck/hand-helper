name: Native SwiftUI iOS (unsigned)

on:
  workflow_dispatch:
  push:
    paths:
      - 'native_ios/**'
      - '.github/workflows/native-ios-unsigned.yml'
  pull_request:
    paths:
      - 'native_ios/**'
      - '.github/workflows/native-ios-unsigned.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: native_ios
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select and inspect Xcode
        run: |
          test -d /Applications/Xcode_26.1.1.app/Contents/Developer
          sudo xcode-select -s /Applications/Xcode_26.1.1.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list devices available

      - name: Install pinned XcodeGen
        run: |
          # Source build avoids the intermittent GitHub Release-asset 504 while
          # remaining fixed to XcodeGen 2.44.1's immutable commit.
          readonly XCODEGEN_VERSION='2.44.1'
          readonly XCODEGEN_REVISION='21ac9944b0ab546a07422dbed86f33dd2ebd76f8'
          readonly XCODEGEN_SOURCE='https://github.com/yonaskolb/XcodeGen.git'
          rm -rf .tools/XcodeGen
          git init --quiet .tools/XcodeGen
          git -C .tools/XcodeGen remote add origin "$XCODEGEN_SOURCE"
          git -C .tools/XcodeGen fetch --quiet --depth 1 origin \
            "refs/tags/$XCODEGEN_VERSION:refs/tags/$XCODEGEN_VERSION"
          git -C .tools/XcodeGen checkout --quiet --detach "refs/tags/$XCODEGEN_VERSION"
          test "$(git -C .tools/XcodeGen rev-parse HEAD)" = "$XCODEGEN_REVISION"
          swift build --package-path .tools/XcodeGen --configuration release
          binary="$PWD/.tools/XcodeGen/.build/release/xcodegen"
          test -x "$binary"
          "$binary" --version | grep -F "$XCODEGEN_VERSION"
          echo "XCODEGEN=$binary" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: |
          "$XCODEGEN" generate --spec project.yml
          xcodebuild -list -project HandHelperNative.xcodeproj

      - name: Build iOS Simulator Debug
        run: |
          xcodebuild build -project HandHelperNative.xcodeproj -scheme HandHelperNative \
            -configuration Debug -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.1' \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO

      - name: Run XCTest
        run: |
          xcodebuild test -project HandHelperNative.xcodeproj -scheme HandHelperNative \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.1' \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO

      - name: Build iOS Device Release
        run: |
          xcodebuild build -project HandHelperNative.xcodeproj -scheme HandHelperNative \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO

      - name: Package and verify unsigned IPA
        run: |
          app=build/DerivedData/Build/Products/Release-iphoneos/HandHelperNative.app
          test -x "$app/HandHelperNative"
          test -f "$app/Assets.car"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = 'com.zhangzh.hangassistant.native.dev'
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$app/Info.plist")" = 'AppIcon'
          test "$(/usr/libexec/PlistBuddy -c 'Print NSSupportsLiveActivities' "$app/Info.plist")" = 'true'
          extension="$app/PlugIns/HandHelperLiveActivityWidget.appex"
          test -x "$extension/HandHelperLiveActivityWidget"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$extension/Info.plist")" = 'com.zhangzh.hangassistant.native.dev.liveactivity'
          test "$(/usr/libexec/PlistBuddy -c 'Print NSExtension:NSExtensionPointIdentifier' "$extension/Info.plist")" = 'com.apple.widgetkit-extension'
          mkdir -p build/ipa/Payload
          /usr/bin/ditto "$app" build/ipa/Payload/HandHelperNative.app
          (cd build/ipa && /usr/bin/ditto -c -k --keepParent Payload ../HandHelperNative-unsigned.ipa)
          /usr/bin/unzip -tqq build/HandHelperNative-unsigned.ipa
          mkdir -p build/verified
          /usr/bin/ditto -x -k build/HandHelperNative-unsigned.ipa build/verified
          extracted=build/verified/Payload/HandHelperNative.app
          test -x "$extracted/HandHelperNative"
          test -f "$extracted/Assets.car"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$extracted/Info.plist")" = 'com.zhangzh.hangassistant.native.dev'
          test -x "$extracted/PlugIns/HandHelperLiveActivityWidget.appex/HandHelperLiveActivityWidget"
          test "$(/usr/libexec/PlistBuddy -c 'Print NSExtension:NSExtensionPointIdentifier' "$extracted/PlugIns/HandHelperLiveActivityWidget.appex/Info.plist")" = 'com.apple.widgetkit-extension'

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: HandHelperNative-unsigned-ipa
          path: native_ios/build/HandHelperNative-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
