name: Native SwiftUI iOS (unsigned)

on:
  workflow_dispatch:
    inputs:
      timetable_cell_diagnostic:
        description: 'DEBUG-only occupied-cell rendering comparison'
        required: false
        default: "none"
        type: choice
        options:
          - "none"
          - "disabled-button"
          - "plain-rectangle"
  push:
    paths:
      - 'native_ios/**'
      - '.github/workflows/native-ios-unsigned.yml'
  pull_request:
    paths:
      - 'native_ios/**'
      - '.github/workflows/native-ios-unsigned.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: native_ios
    steps:
      - uses: actions/checkout@v4

      - name: Select and inspect Xcode
        run: |
          test -d /Applications/Xcode_26.1.1.app/Contents/Developer
          sudo xcode-select -s /Applications/Xcode_26.1.1.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list devices available

      - name: Install pinned XcodeGen
        run: |
          mkdir -p .tools/xcodegen
          curl --fail --location --retry 3 \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip \
            --output .tools/xcodegen.zip
          unzip -q .tools/xcodegen.zip -d .tools/xcodegen
          binary="$(find .tools/xcodegen -type f -name xcodegen | head -n 1)"
          test -n "$binary"
          chmod +x "$binary"
          "$binary" --version | grep -F '2.44.1'
          echo "XCODEGEN=$PWD/$binary" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: |
          "$XCODEGEN" generate --spec project.yml
          xcodebuild -list -project HandHelperNative.xcodeproj

      - name: Build iOS Simulator Debug
        run: |
          xcodebuild build -project HandHelperNative.xcodeproj -scheme HandHelperNative \
            -configuration Debug -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.1' \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO

      - name: Run XCTest
        run: |
          xcodebuild test -project HandHelperNative.xcodeproj -scheme HandHelperNative \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.1' \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO

      - name: Build iOS Device Release
        run: |
          xcodebuild build -project HandHelperNative.xcodeproj -scheme HandHelperNative \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO

      - name: Package and verify unsigned IPA
        run: |
          app=build/DerivedData/Build/Products/Release-iphoneos/HandHelperNative.app
          test -x "$app/HandHelperNative"
          test -f "$app/Assets.car"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = 'com.zhangzh.hangassistant.native.dev'
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$app/Info.plist")" = 'AppIcon'
          test "$(/usr/libexec/PlistBuddy -c 'Print NSSupportsLiveActivities' "$app/Info.plist")" = 'true'
          extension="$app/PlugIns/HandHelperLiveActivityWidget.appex"
          test -x "$extension/HandHelperLiveActivityWidget"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$extension/Info.plist")" = 'com.zhangzh.hangassistant.native.dev.liveactivity'
          test "$(/usr/libexec/PlistBuddy -c 'Print NSExtension:NSExtensionPointIdentifier' "$extension/Info.plist")" = 'com.apple.widgetkit-extension'
          mkdir -p build/ipa/Payload
          /usr/bin/ditto "$app" build/ipa/Payload/HandHelperNative.app
          (cd build/ipa && /usr/bin/ditto -c -k --keepParent Payload ../HandHelperNative-unsigned.ipa)
          /usr/bin/unzip -tqq build/HandHelperNative-unsigned.ipa
          mkdir -p build/verified
          /usr/bin/ditto -x -k build/HandHelperNative-unsigned.ipa build/verified
          extracted=build/verified/Payload/HandHelperNative.app
          test -x "$extracted/HandHelperNative"
          test -f "$extracted/Assets.car"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$extracted/Info.plist")" = 'com.zhangzh.hangassistant.native.dev'
          test -x "$extracted/PlugIns/HandHelperLiveActivityWidget.appex/HandHelperLiveActivityWidget"
          test "$(/usr/libexec/PlistBuddy -c 'Print NSExtension:NSExtensionPointIdentifier' "$extracted/PlugIns/HandHelperLiveActivityWidget.appex/Info.plist")" = 'com.apple.widgetkit-extension'

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: HandHelperNative-unsigned-ipa
          path: native_ios/build/HandHelperNative-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  timetable-cell-render-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.timetable_cell_diagnostic != 'none' }}
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: native_ios
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          test -d /Applications/Xcode_26.1.1.app/Contents/Developer
          sudo xcode-select -s /Applications/Xcode_26.1.1.app/Contents/Developer

      - name: Install pinned XcodeGen
        run: |
          mkdir -p .tools/xcodegen
          curl --fail --location --retry 3 \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip \
            --output .tools/xcodegen.zip
          unzip -q .tools/xcodegen.zip -d .tools/xcodegen
          binary="$(find .tools/xcodegen -type f -name xcodegen | head -n 1)"
          test -n "$binary"
          chmod +x "$binary"
          "$binary" --version | grep -F '2.44.1'
          echo "XCODEGEN=$PWD/$binary" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: |
          "$XCODEGEN" generate --spec project.yml

      - name: Build DEBUG diagnostic IPA
        env:
          VARIANT: ${{ github.event.inputs.timetable_cell_diagnostic }}
        run: |
          flags='$(inherited) DEBUG'
          if [ "$VARIANT" = 'plain-rectangle' ]; then
            flags="$flags TIMETABLE_OCCUPIED_CELL_RECTANGLE"
          fi
          xcodebuild build -project HandHelperNative.xcodeproj -scheme HandHelperNative \
            -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DiagnosticDerivedData CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="$flags"

      - name: Package and verify DEBUG diagnostic IPA
        env:
          VARIANT: ${{ github.event.inputs.timetable_cell_diagnostic }}
        run: |
          app=build/DiagnosticDerivedData/Build/Products/Debug-iphoneos/HandHelperNative.app
          test -x "$app/HandHelperNative"
          test -x "$app/PlugIns/HandHelperLiveActivityWidget.appex/HandHelperLiveActivityWidget"
          mkdir -p build/diagnostic-ipa/Payload
          /usr/bin/ditto "$app" build/diagnostic-ipa/Payload/HandHelperNative.app
          name="HandHelperNative-TimetableCell-${VARIANT}-DEBUG-unsigned.ipa"
          (cd build/diagnostic-ipa && /usr/bin/ditto -c -k --keepParent Payload "../$name")
          /usr/bin/unzip -tqq "build/$name"
          test -x "build/diagnostic-ipa/Payload/HandHelperNative.app/PlugIns/HandHelperLiveActivityWidget.appex/HandHelperLiveActivityWidget"

      - name: Upload DEBUG diagnostic IPA
        uses: actions/upload-artifact@v4
        with:
          name: HandHelperNative-TimetableCell-${{ inputs.timetable_cell_diagnostic }}-DEBUG-unsigned-ipa
          path: native_ios/build/HandHelperNative-TimetableCell-${{ inputs.timetable_cell_diagnostic }}-DEBUG-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
