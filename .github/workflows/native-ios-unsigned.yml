name: Native SwiftUI iOS (unsigned)

on:
  workflow_dispatch:
    inputs:
      live_activity_diagnostic_ipa:
        description: 'Also package a clearly marked Debug IPA with Live Activity diagnostics'
        type: boolean
        default: false
      live_activity_width_variant:
        description: 'Debug Live Activity compact-width experiment (A=baseline, B=proportional timer digits, C=empty trailing, D=40 pt timer, E=48 pt timer, F=fixed-size timer)'
        type: choice
        options:
          - A
          - B
          - C
          - D
          - E
          - F
        default: A
  push:
    paths:
      - 'native_ios/**'
      - '.github/workflows/native-ios-unsigned.yml'
  pull_request:
    paths:
      - 'native_ios/**'
      - '.github/workflows/native-ios-unsigned.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: native_ios
    steps:
      - uses: actions/checkout@v4

      - name: Select and inspect Xcode
        run: |
          test -d /Applications/Xcode_26.1.1.app/Contents/Developer
          sudo xcode-select -s /Applications/Xcode_26.1.1.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list devices available

      - name: Install pinned XcodeGen
        run: |
          mkdir -p .tools/xcodegen
          curl --fail --location --retry 3 \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip \
            --output .tools/xcodegen.zip
          unzip -q .tools/xcodegen.zip -d .tools/xcodegen
          binary="$(find .tools/xcodegen -type f -name xcodegen | head -n 1)"
          test -n "$binary"
          chmod +x "$binary"
          "$binary" --version | grep -F '2.44.1'
          echo "XCODEGEN=$PWD/$binary" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: |
          "$XCODEGEN" generate --spec project.yml
          xcodebuild -list -project HandHelperNative.xcodeproj

      - name: Build iOS Simulator Debug
        run: |
          xcodebuild build -project HandHelperNative.xcodeproj -scheme HandHelperNative \
            -configuration Debug -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.1' \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO

      - name: Run XCTest
        run: |
          xcodebuild test -project HandHelperNative.xcodeproj -scheme HandHelperNative \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.1' \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO

      - name: Build iOS Device Release
        run: |
          xcodebuild build -project HandHelperNative.xcodeproj -scheme HandHelperNative \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO

      - name: Package and verify unsigned IPA
        run: |
          app=build/DerivedData/Build/Products/Release-iphoneos/HandHelperNative.app
          test -x "$app/HandHelperNative"
          test -f "$app/Assets.car"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = 'com.zhangzh.hangassistant.native.dev'
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$app/Info.plist")" = 'AppIcon'
          test "$(/usr/libexec/PlistBuddy -c 'Print NSSupportsLiveActivities' "$app/Info.plist")" = 'true'
          extension="$app/PlugIns/HandHelperLiveActivityWidget.appex"
          test -x "$extension/HandHelperLiveActivityWidget"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$extension/Info.plist")" = 'com.zhangzh.hangassistant.native.dev.liveactivity'
          test "$(/usr/libexec/PlistBuddy -c 'Print NSExtension:NSExtensionPointIdentifier' "$extension/Info.plist")" = 'com.apple.widgetkit-extension'
          mkdir -p build/ipa/Payload
          /usr/bin/ditto "$app" build/ipa/Payload/HandHelperNative.app
          (cd build/ipa && /usr/bin/ditto -c -k --keepParent Payload ../HandHelperNative-unsigned.ipa)
          /usr/bin/unzip -tqq build/HandHelperNative-unsigned.ipa
          mkdir -p build/verified
          /usr/bin/ditto -x -k build/HandHelperNative-unsigned.ipa build/verified
          extracted=build/verified/Payload/HandHelperNative.app
          test -x "$extracted/HandHelperNative"
          test -f "$extracted/Assets.car"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$extracted/Info.plist")" = 'com.zhangzh.hangassistant.native.dev'
          test -x "$extracted/PlugIns/HandHelperLiveActivityWidget.appex/HandHelperLiveActivityWidget"
          test "$(/usr/libexec/PlistBuddy -c 'Print NSExtension:NSExtensionPointIdentifier' "$extracted/PlugIns/HandHelperLiveActivityWidget.appex/Info.plist")" = 'com.apple.widgetkit-extension'

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: HandHelperNative-unsigned-ipa
          path: native_ios/build/HandHelperNative-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Build Live Activity diagnostic Debug IPA
        id: live-activity-diagnostic
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-activity-diagnostic]'))
        env:
          LIVE_ACTIVITY_WIDTH_VARIANT: ${{ inputs.live_activity_width_variant || 'A' }}
        run: |
          case "$LIVE_ACTIVITY_WIDTH_VARIANT" in
            A) width_test_flags=() ;;
            B) width_test_flags=("OTHER_SWIFT_FLAGS=-D LIVE_ACTIVITY_WIDTH_TEST_B") ;;
            C) width_test_flags=("OTHER_SWIFT_FLAGS=-D LIVE_ACTIVITY_WIDTH_TEST_C") ;;
            D) width_test_flags=("OTHER_SWIFT_FLAGS=-D LIVE_ACTIVITY_WIDTH_TEST_D") ;;
            E) width_test_flags=("OTHER_SWIFT_FLAGS=-D LIVE_ACTIVITY_WIDTH_TEST_E") ;;
            F) width_test_flags=("OTHER_SWIFT_FLAGS=-D LIVE_ACTIVITY_WIDTH_TEST_F") ;;
            *) echo "Unsupported Live Activity width variant: $LIVE_ACTIVITY_WIDTH_VARIANT" >&2; exit 1 ;;
          esac
          xcodebuild build -project HandHelperNative.xcodeproj -scheme HandHelperNative \
            -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DiagnosticData CODE_SIGNING_ALLOWED=NO "${width_test_flags[@]}"
          app=build/DiagnosticData/Build/Products/Debug-iphoneos/HandHelperNative.app
          test -x "$app/HandHelperNative"
          test -x "$app/PlugIns/HandHelperLiveActivityWidget.appex/HandHelperLiveActivityWidget"
          mkdir -p build/diagnostic-ipa/Payload
          /usr/bin/ditto "$app" build/diagnostic-ipa/Payload/HandHelperNative.app
          ipa="build/HandHelperNative-LiveActivity-WIDTH-${LIVE_ACTIVITY_WIDTH_VARIANT}-DIAGNOSTIC-unsigned.ipa"
          (cd build/diagnostic-ipa && /usr/bin/ditto -c -k --keepParent Payload "../$(basename "$ipa")")
          /usr/bin/unzip -tqq "$ipa"
          echo "variant=$LIVE_ACTIVITY_WIDTH_VARIANT" >> "$GITHUB_OUTPUT"
          echo "ipa=$ipa" >> "$GITHUB_OUTPUT"

      - name: Upload optional diagnostic Debug IPA
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-activity-diagnostic]'))
        uses: actions/upload-artifact@v4
        with:
          name: HandHelperNative-LiveActivity-WIDTH-${{ steps.live-activity-diagnostic.outputs.variant }}-DIAGNOSTIC-unsigned-ipa
          path: native_ios/${{ steps.live-activity-diagnostic.outputs.ipa }}
          if-no-files-found: error
          retention-days: 3

  live-activity-width-experiments:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[live-activity-width-test]')
    name: Live Activity width experiment (${{ matrix.variant }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [A, B, C, D, E, F]
    defaults:
      run:
        shell: bash
        working-directory: native_ios
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          test -d /Applications/Xcode_26.1.1.app/Contents/Developer
          sudo xcode-select -s /Applications/Xcode_26.1.1.app/Contents/Developer

      - name: Install pinned XcodeGen
        run: |
          mkdir -p .tools/xcodegen
          curl --fail --location --retry 3 \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip \
            --output .tools/xcodegen.zip
          unzip -q .tools/xcodegen.zip -d .tools/xcodegen
          binary="$(find .tools/xcodegen -type f -name xcodegen | head -n 1)"
          test -n "$binary"
          chmod +x "$binary"
          echo "XCODEGEN=$PWD/$binary" >> "$GITHUB_ENV"

      - name: Build Debug width experiment
        run: |
          "$XCODEGEN" generate --spec project.yml
          case "${{ matrix.variant }}" in
            A) width_test_flags=() ;;
            B) width_test_flags=("OTHER_SWIFT_FLAGS=-D LIVE_ACTIVITY_WIDTH_TEST_B") ;;
            C) width_test_flags=("OTHER_SWIFT_FLAGS=-D LIVE_ACTIVITY_WIDTH_TEST_C") ;;
            D) width_test_flags=("OTHER_SWIFT_FLAGS=-D LIVE_ACTIVITY_WIDTH_TEST_D") ;;
            E) width_test_flags=("OTHER_SWIFT_FLAGS=-D LIVE_ACTIVITY_WIDTH_TEST_E") ;;
            F) width_test_flags=("OTHER_SWIFT_FLAGS=-D LIVE_ACTIVITY_WIDTH_TEST_F") ;;
            *) echo "Unsupported Live Activity width variant: ${{ matrix.variant }}" >&2; exit 1 ;;
          esac
          xcodebuild build -project HandHelperNative.xcodeproj -scheme HandHelperNative \
            -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "build/Width-${{ matrix.variant }}" CODE_SIGNING_ALLOWED=NO "${width_test_flags[@]}"
          app="build/Width-${{ matrix.variant }}/Build/Products/Debug-iphoneos/HandHelperNative.app"
          test -x "$app/HandHelperNative"
          test -x "$app/PlugIns/HandHelperLiveActivityWidget.appex/HandHelperLiveActivityWidget"
          mkdir -p build/width-ipa/Payload
          /usr/bin/ditto "$app" build/width-ipa/Payload/HandHelperNative.app
          (cd build/width-ipa && /usr/bin/ditto -c -k --keepParent Payload "../HandHelperNative-LiveActivity-WIDTH-${{ matrix.variant }}-DIAGNOSTIC-unsigned.ipa")
          /usr/bin/unzip -tqq "build/HandHelperNative-LiveActivity-WIDTH-${{ matrix.variant }}-DIAGNOSTIC-unsigned.ipa"

      - name: Upload width experiment IPA
        uses: actions/upload-artifact@v4
        with:
          name: HandHelperNative-LiveActivity-WIDTH-${{ matrix.variant }}-DIAGNOSTIC-unsigned-ipa
          path: native_ios/build/HandHelperNative-LiveActivity-WIDTH-${{ matrix.variant }}-DIAGNOSTIC-unsigned.ipa
          if-no-files-found: error
          retention-days: 3
