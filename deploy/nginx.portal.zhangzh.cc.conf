# External HTTPS reverse proxy for the production Hand Helper site.
# Copy to /etc/nginx/sites-enabled/portal.zhangzh.cc after the certificate
# for portal.zhangzh.cc has been issued.
limit_req_zone $binary_remote_addr zone=hand_helper_auth:10m rate=10r/m;

server {
  listen 80;
  listen [::]:80;
  server_name portal.zhangzh.cc;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name portal.zhangzh.cc;

  ssl_certificate /etc/letsencrypt/live/portal.zhangzh.cc/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/portal.zhangzh.cc/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  client_max_body_size 6m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Auth responses and session-changing routes must never be cached.
  location ~ ^/api/(v1/)?auth/ {
    limit_req zone=hand_helper_auth burst=5 nodelay;
    proxy_pass http://127.0.0.1:18101;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "no-store" always;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:18101;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location / {
    proxy_pass http://127.0.0.1:18101;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
