# Legacy endpoint retained so existing app versions and bookmarks reach the
# canonical hand.zhangzh.cc domain without a certificate warning.

server {
  listen 80;
  listen [::]:80;
  server_name portal.zhangzh.cc;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / { return 301 https://hand.zhangzh.cc$request_uri; }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name portal.zhangzh.cc;

  ssl_certificate /etc/letsencrypt/live/portal.zhangzh.cc/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/portal.zhangzh.cc/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  return 301 https://hand.zhangzh.cc$request_uri;
}
