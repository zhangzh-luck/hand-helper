# Retain the old public address only as a redirect to the canonical domain.
server {
  listen 80;
  listen [::]:80;
  server_name jw.zhangzh.cc;
  return 301 https://hand.zhangzh.cc$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name jw.zhangzh.cc;

  ssl_certificate /etc/letsencrypt/live/jw.zhangzh.cc/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/jw.zhangzh.cc/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  return 301 https://hand.zhangzh.cc$request_uri;
}
