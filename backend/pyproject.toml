[project]
name = "hand-helper-backend"
version = "0.1.0"
description = "航的助手（Hand Helper）后端"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3",
  "aiosqlite>=0.20,<1", "alembic>=1.13,<2", "pydantic-settings>=2.3,<3",
  "pyjwt>=2.8,<3", "passlib[bcrypt]>=1.7,<2", "bcrypt>=4.1,<5",
  "beautifulsoup4>=4.12,<5", "lxml>=5,<6",
  "apscheduler>=3.10,<4", "xlrd>=2.0,<3", "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1", "cryptography>=42,<46"
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "tools*"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.5,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
