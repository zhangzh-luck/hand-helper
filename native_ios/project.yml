name: HandHelperNative
options:
  minimumXcodeGenVersion: 2.44.1
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HandHelperNative:
    type: application
    platform: iOS
    sources:
      - path: HandHelperNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhangzh.hangassistant.native.dev
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 航的助手
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    info:
      path: HandHelperNative/Resources/AppInfo.plist
      properties:
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.zhangzh.hangassistant.native.dev.today
            CFBundleURLSchemes: [handhelper]
    dependencies:
      - target: HandHelperLiveActivityWidget
        embed: true
  HandHelperLiveActivityWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: HandHelperLiveActivityWidget
      - path: HandHelperNative/LiveActivities/HandHelperActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhangzh.hangassistant.native.dev.liveactivity
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: HandHelperLiveActivityWidget/Info.plist
      properties:
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  HandHelperNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HandHelperNativeTests
    dependencies:
      - target: HandHelperNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhangzh.hangassistant.native.dev.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HandHelperNative:
    build:
      targets:
        HandHelperNative: all
        HandHelperNativeTests: [test]
    test:
      targets:
        - HandHelperNativeTests
